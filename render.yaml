services:
  - type: web
    name: visionmate
    runtime: python
    region: singapore
    plan: free
    pythonVersion: "3.11.9"

    buildCommand: >-
      apt-get update -qq &&
      apt-get install -y -qq libgl1 libglib2.0-0 libsrtp2-1 libopus0 &&
      pip install -r requirements.txt

    startCommand: >-
      streamlit run app.py
      --server.port $PORT
      --server.address 0.0.0.0
      --server.headless true

    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: STREAMLIT_SERVER_HEADLESS
        value: "true"
      - key: STREAMLIT_BROWSER_GATHER_USAGE_STATS
        value: "false"
      - key: DEBIAN_FRONTEND
        value: noninteractive

    autoDeploy: true
