[server]
headless = true
port = 8501
enableCORS = false
enableXsrfProtection = false
maxUploadSize = 50

[browser]
gatherUsageStats = false

# WebRTC needs these timeouts relaxed on cloud deployments
[server.websocket]
# Default ping timeout is too short for WebRTC negotiation
pingTimeout = 120
pingInterval = 20

[theme]
base = "dark"
backgroundColor = "#0f1117"
secondaryBackgroundColor = "#1e2130"
primaryColor = "#3498db"
textColor = "#e0e0e0"
font = "sans serif"
